# Builds the Android APK on GitHub's free servers — no Android Studio needed.
# Every push to main publishes a new release; the website's "Download APK"
# button always points to the newest one.
name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apk:
    # Pinned (not ubuntu-latest) so GitHub's runner upgrades can't break the build.
    # Ubuntu 24.04 ships with the Android SDK and Java preinstalled.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Check project files
        run: |
          missing=0
          for f in package.json package-lock.json site.config.json capacitor.config.json \
                   android/gradlew android/build.gradle android/app/build.gradle \
                   android/app/src/main/AndroidManifest.xml src/app/index.html scripts/build.mjs; do
            if [ ! -f "$f" ]; then echo "::error::Missing file: $f — upload it to GitHub again."; missing=1; fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi
          echo "All required files found."

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "Android SDK: $SDK"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-36" > /dev/null || echo "::warning::Could not preinstall platform 36; Gradle will try."
            "$SDKM" "build-tools;36.0.0" > /dev/null || echo "::warning::Could not preinstall build-tools; Gradle will try."
          else
            echo "::warning::sdkmanager not found; relying on Gradle to fetch SDK parts."
          fi

      - name: Install
        run: npm ci || npm install

      - name: Build web app
        run: npm run build

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "VNS_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set. Building a debug APK. Users will have to uninstall before each update. See the guide, Part 4."
          fi

      - name: Build APK
        working-directory: android
        env:
          VNS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          if [ "$SIGNED" = "1" ]; then
            ./gradlew --no-daemon assembleRelease -PvnsVersionCode=${GITHUB_RUN_NUMBER} -PvnsVersionName=$VERSION
            cp app/build/outputs/apk/release/app-release.apk ../VoiceNoteSummarizer.apk
          else
            ./gradlew --no-daemon assembleDebug -PvnsVersionCode=${GITHUB_RUN_NUMBER} -PvnsVersionName=$VERSION
            cp app/build/outputs/apk/debug/app-debug.apk ../VoiceNoteSummarizer.apk
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -la ../VoiceNoteSummarizer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceNoteSummarizer-${{ env.VERSION }}
          path: VoiceNoteSummarizer.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Voice Note Summarizer ${{ env.VERSION }}
          body: |
            Install: download **VoiceNoteSummarizer.apk** on your Android phone, open it and tap Install.
            Then in WhatsApp: long-press a voice note → ⋮ → Share → Voice Note Summarizer.
          files: VoiceNoteSummarizer.apk
          make_latest: true
